name: Daily market scan

on:
  schedule:
    - cron: "45 10 * * 1-5"   # 4:15 pm India time, Monday to Friday
  workflow_dispatch:           # adds a "Run workflow" button for a manual scan

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Scan market
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python scanner.py
      - name: Save results
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add docs data
          git commit -m "Scan $(date -u +%F)" || echo "nothing new"
          git push
