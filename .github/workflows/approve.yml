name: Approve live order

on:
  workflow_dispatch:
    inputs:
      proposal_id:
        description: "Proposal ID from the Live Desk (10 characters)"
        required: true
      decision:
        description: "APPROVE or REJECT"
        required: true
        default: "APPROVE"
      confirm:
        description: "Type YES to confirm this is a REAL-MONEY order"
        required: true

concurrency: { group: vision-site, cancel-in-progress: false }
permissions: { contents: write, pages: write, id-token: write }

jobs:
  approve:
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/checkout@v4
      - name: Fetch site state
        run: |
          git fetch origin gh-pages:gh-pages
          mkdir -p site && git --work-tree=site checkout gh-pages -- .
          cp -r docs/. site/
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install "cryptography>=41"
      - name: Record decision
        env:
          PID: ${{ inputs.proposal_id }}
          DECISION: ${{ inputs.decision }}
          CONFIRM: ${{ inputs.confirm }}
          ACTOR: ${{ github.actor }}
          PORTAL_KEY: ${{ secrets.PORTAL_KEY }}
          PORTAL_KEY_OLD: ${{ secrets.PORTAL_KEY_OLD }}
        run: python -m engine.live.approve --site site
      - run: rm -rf site/.git
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Keep gh-pages in sync
        run: |
          cd site && touch .nojekyll && git init -q && git config user.name "vision-ai-bot" && git config user.email "vision-ai-bot@users.noreply.github.com"
          git checkout -q -b gh-pages && git add -A && git commit -q -m "approval $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
