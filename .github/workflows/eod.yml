name: EOD scan + paper trading

on:
  push:
    branches: [main]
  schedule:
    - cron: "50 10 * * 1-5"    # 16:20 IST, Monday-Friday (Actions cron may be delayed 5-30 min)
    - cron: "15 13 * * 1-5"    # 18:45 IST: re-run once NSE's official bhavcopy / index files are out (fills any gap in the free feed)
  workflow_dispatch:

# Own queue: the 5-minute live-session schedule can no longer knock a waiting end-of-day run out of the queue.
# The two never write the site at the same time: this run waits for a running live session (which hands over within ~2 min),
# and live sessions that start while this run is queued/running skip entirely.
concurrency: { group: vision-eod, cancel-in-progress: false }
permissions: { contents: write, pages: write, id-token: write, actions: read }

jobs:
  eod:
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    timeout-minutes: 40
    steps:
      - name: Wait for a running live session to hand over
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          for i in $(seq 1 90); do
            n=$(gh api "repos/${{ github.repository }}/actions/workflows/intraday.yml/runs?status=in_progress&per_page=5" --jq '.total_count' 2>/dev/null || echo 0)
            [ "$n" = "0" ] && break
            echo "live session still running ($n) - waiting"; sleep 20
          done
      - uses: actions/checkout@v4
      - name: Fetch site state (gh-pages)
        run: |
          git fetch origin gh-pages:gh-pages || echo "no gh-pages yet"
          mkdir -p site
          if git show-ref --quiet refs/heads/gh-pages; then git --work-tree=site checkout gh-pages -- . || true; fi
          cp -r docs/. site/
          cp -r docs/assets site/ 2>/dev/null || true
      - name: Live results from runner (if any)
        run: |
          git fetch origin live-results:live-results 2>/dev/null && mkdir -p site/live && git --work-tree=site/live checkout live-results -- . || echo "no live results"
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Run engine (EOD)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          LIVE_TRADING: ${{ vars.LIVE_TRADING }}
          LIVE_AUTO: ${{ vars.LIVE_AUTO }}
          LIVE_CONSENT: ${{ vars.LIVE_CONSENT }}
          LIVE_KILL: ${{ vars.LIVE_KILL }}
          LIVE_MAX_ORDERS_DAY: ${{ vars.LIVE_MAX_ORDERS_DAY }}
          LIVE_MAX_ORDER_VALUE: ${{ vars.LIVE_MAX_ORDER_VALUE }}
          LIVE_MAX_DAILY_LOSS: ${{ vars.LIVE_MAX_DAILY_LOSS }}
          LIVE_SEGMENTS: ${{ vars.LIVE_SEGMENTS }}
          LIVE_CAPITAL: ${{ vars.LIVE_CAPITAL }}
          ALERT_RULES: ${{ vars.ALERT_RULES }}
          VISION_MODE: ${{ vars.VISION_MODE }}
        run: python -m engine.run eod --site site
      - name: Telegram summary (only if token is set)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m engine.notify --site site || true
      - name: Publish site (single-commit gh-pages, history never grows)
        run: |
          cd site
          touch .nojekyll
          git init -q
          git config user.name "vision-ai-bot"
          git config user.email "vision-ai-bot@users.noreply.github.com"
          git checkout -q -b gh-pages
          git add -A
          git commit -q -m "EOD $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
      - run: rm -rf site/.git
      - name: Configure Pages (switches the site to Actions deploys)
        uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
