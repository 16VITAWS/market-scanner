name: Live session (quotes + live paper trading)

on:
  schedule:
    - cron: "*/5 3-10 * * 1-5"    # India session window (08:30-16:29 IST); each run loops ~24 min, refreshing every ~2 min
    - cron: "*/5 13-20 * * 1-5"   # US session window (19:00-02:29 IST)
  workflow_dispatch:

concurrency: { group: vision-site, cancel-in-progress: false }
permissions: { contents: write, pages: write, id-token: write }

jobs:
  intraday:
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Fetch site state
        run: |
          git fetch origin gh-pages:gh-pages || exit 0
          mkdir -p site && git --work-tree=site checkout gh-pages -- . || true
          cp -r docs/. site/
      - name: Live results from runner (if any)
        run: |
          git fetch origin live-results:live-results 2>/dev/null && mkdir -p site/live && git --work-tree=site/live checkout live-results -- . || echo "no live results"
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Run engine
        env:
          LIVE_TRADING: ${{ vars.LIVE_TRADING }}
          LIVE_AUTO: ${{ vars.LIVE_AUTO }}
          LIVE_CONSENT: ${{ vars.LIVE_CONSENT }}
          LIVE_KILL: ${{ vars.LIVE_KILL }}
          LIVE_MAX_ORDERS_DAY: ${{ vars.LIVE_MAX_ORDERS_DAY }}
          LIVE_MAX_ORDER_VALUE: ${{ vars.LIVE_MAX_ORDER_VALUE }}
          LIVE_MAX_DAILY_LOSS: ${{ vars.LIVE_MAX_DAILY_LOSS }}
          LIVE_SEGMENTS: ${{ vars.LIVE_SEGMENTS }}
          LIVE_CAPITAL: ${{ vars.LIVE_CAPITAL }}
          ALERT_RULES: ${{ vars.ALERT_RULES }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VISION_MODE: ${{ vars.VISION_MODE }}
          LIVE_PUSH_TOKEN: ${{ github.token }}
          LIVE_MINUTES: "24"
          LIVE_EVERY_SECONDS: "120"
        run: python -m engine.run intraday --site site
      - name: Publish
        run: |
          cd site && touch .nojekyll && git init -q && git config user.name "vision-ai-bot" && git config user.email "vision-ai-bot@users.noreply.github.com"
          git checkout -q -b gh-pages && git add -A && git commit -q -m "intraday $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
      - run: rm -rf site/.git
      - name: Configure Pages (switches the site to Actions deploys)
        uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
