name: Weekend review

on:
  schedule:
    - cron: "30 3 * * 6"    # Saturday 09:00 IST
  workflow_dispatch:

concurrency: { group: vision-site, cancel-in-progress: false }
permissions: { contents: write }

jobs:
  weekend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: |
          git fetch origin gh-pages:gh-pages || echo "no gh-pages yet"
          mkdir -p site && (git show-ref --quiet refs/heads/gh-pages && git --work-tree=site checkout gh-pages -- . || true)
          cp docs/index.html site/index.html
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: python -m engine.run weekend --site site
      - run: |
          cd site && touch .nojekyll && git init -q && git config user.name "vision-ai-bot" && git config user.email "vision-ai-bot@users.noreply.github.com"
          git checkout -q -b gh-pages && git add -A && git commit -q -m "weekend $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
